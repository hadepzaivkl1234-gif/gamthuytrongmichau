<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=900,H=460,G=384,SK='ttmn_save_v2',cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rd=Math.random;
const fresh=()=>({lv:0,done:0,rel:[0,0,0,0,0],score:0,ok:0,bad:0,kills:0,hits:0,time:0,vol:.5,mute:0,chest:-1});
const load=()=>{try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
let S=Object.assign(fresh(),load()||{});
const fmt=s=>((s/60)|0)+':'+String(s%60|0).padStart(2,'0');
// ===== ÂM THANH =====
let AC,mg,mt,mi=-1,ms=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination)}catch(e){return}}if(AC.state=='suspended')AC.resume();mg.gain.value=S.mute?0:S.vol}
function tone(f,t,d,v,f2){if(!AC||S.mute||AC.state!='running')return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(mg);o.start(n);o.stop(n+d)}
const SF={shoot:[620,'triangle',.1,.1,300],jump:[300,'sine',.12,.1,520],hit:[220,'square',.08,.07],kill:[160,'sawtooth',.2,.12,60],hurt:[130,'sawtooth',.25,.15,70],chest:[520,'sine',.3,.12,880],ok:[660,'sine',.4,.15,1320],bad:[160,'sawtooth',.35,.14,80],boss:[90,'sawtooth',.5,.18,50],bdie:[200,'sawtooth',1.2,.2,30],win:[523,'triangle',.8,.15,1046]},ls={};
function sfx(n){const t=performance.now();if(ls[n]&&t-ls[n]<70)return;ls[n]=t;tone(...SF[n])}
const MU=[{s:[0,2,4,7,9],b:196,t:.3,w:'triangle'},{s:[0,3,5,6,10],b:147,t:.4,w:'sine'},{s:[0,2,4,5,7],b:174,t:.26,w:'square'},{s:[0,1,5,7,8],b:130,t:.38,w:'sine'},{s:[0,1,3,6,7],b:110,t:.18,w:'sawtooth'},{s:[0,2,4,7,9],b:262,t:.2,w:'triangle'}];
function music(i){clearInterval(mt);mi=i;if(i<0)return;mt=setInterval(()=>{if(!AC||S.mute||AC.state!='running')return;const m=MU[mi];tone(m.b*Math.pow(2,m.s[(ms*2+(ms>>3))%5]/12)*(ms%8<4?1:1.5),m.w,m.t*1.6,.045);if(ms%4==0)tone(m.b/2,'sine',m.t*3,.06);ms++},MU[i].t*1000)}
function mute(){S.mute^=1;au();save();hud()}
function setv(v){S.vol=+v;if(mg)mg.gain.value=S.mute?0:S.vol;save()}
// ===== NGÂN HÀNG CÂU HỎI (đã kiểm tra đáp án) =====
// ===== NGÂN HÀNG CÂU HỎI: mỗi màn dùng đúng một hình thức (QT) =====
// t='mc' trắc nghiệm: o=4 phương án, a=chỉ số đáp án đúng, e=giải thích
// t='tf' đúng/sai: i=[[nhận định, 1=Đúng|0=Sai, giải thích] x4]
// t='sa' trả lời ngắn: a=[các đáp án chấp nhận], e=giải thích
// Để thêm câu mới: chỉ cần thêm một đối tượng cùng dạng vào mảng QB (s = chỉ số môn trong SUB).
const SUB=['HÓA HỌC 12','VẬT LÝ 12','TOÁN HỌC 12','SINH HỌC 12','TỔNG HỢP TOÁN – LÝ 12'];
const QT=['mc','tf','tf','sa','sa'],LP=[[0],[1],[2],[3],[4]],TL={mc:'TRẮC NGHIỆM',tf:'ĐÚNG/SAI',sa:'TRẢ LỜI NGẮN'};
const QB=[
{t:'mc',s:0,q:"Đồng thau (dùng làm đồ dùng, binh khí cổ) là hợp kim của đồng (\\(\\ce{Cu}\\)) với kim loại nào sau đây?",o:["Kẽm (\\(\\ce{Zn}\\))","Nhôm (\\(\\ce{Al}\\))","Sắt (\\(\\ce{Fe}\\))","Bạc (\\(\\ce{Ag}\\))"],a:0,e:"Đồng thau là hợp kim \\(\\ce{Cu}\\)–\\(\\ce{Zn}\\)."},
{t:'mc',s:0,q:"Để bảo vệ chi tiết bằng sắt khỏi ăn mòn điện hóa trong môi trường ẩm, người ta gắn vào nó lá kim loại nào?",o:["Đồng (\\(\\ce{Cu}\\))","Kẽm (\\(\\ce{Zn}\\))","Bạc (\\(\\ce{Ag}\\))","Chì (\\(\\ce{Pb}\\))"],a:1,e:"\\(\\ce{Zn}\\) hoạt động hơn \\(\\ce{Fe}\\) nên bị ăn mòn thay (bảo vệ điện hóa)."},
{t:'mc',s:0,q:"Glucozơ (\\(\\ce{C6H12O6}\\)) thuộc loại cacbohiđrat nào?",o:["Monosaccarit","Đisaccarit","Polisaccarit","Lipit"],a:0,e:"Glucozơ là monosaccarit."},
{t:'mc',s:0,q:"Phản ứng thủy phân este trong dung dịch \\(\\ce{NaOH}\\), đun nóng, gọi là phản ứng:",o:["Este hóa","Xà phòng hóa","Trùng ngưng","Hiđro hóa"],a:1,e:"Tạo muối cacboxylat và ancol."},
{t:'tf',s:1,q:"Một vật dao động điều hòa theo phương trình \\(x = 4\\cos(2\\pi t)\\ \\text{cm}\\) (\\(t\\) tính bằng giây). Xét các nhận định sau:",i:[["Biên độ dao động của vật là \\(4\\ \\text{cm}\\).",1,"\\(A = 4\\ \\text{cm}\\)."],["Chu kì dao động của vật là \\(2\\ \\text{s}\\).",0,"\\(T = \\dfrac{2\\pi}{\\omega} = \\dfrac{2\\pi}{2\\pi} = 1\\ \\text{s}\\)."],["Tần số dao động của vật là \\(1\\ \\text{Hz}\\).",1,"\\(f = \\dfrac{1}{T} = 1\\ \\text{Hz}\\)."],["Tại thời điểm \\(t = 0\\), vật ở vị trí cân bằng.",0,"\\(x(0) = 4\\cos 0 = 4\\ \\text{cm}\\) nên vật đang ở biên dương."]]},
{t:'tf',s:1,q:"Con lắc lò xo nằm ngang có \\(k = 200\\ \\text{N/m}\\) dao động điều hòa với biên độ \\(A = 0{,}1\\ \\text{m}\\) (bỏ qua ma sát). Xét các nhận định sau:",i:[["Cơ năng của con lắc bằng \\(1\\ \\text{J}\\).",1,"\\(W = \\dfrac{1}{2}kA^2 = \\dfrac{1}{2}\\cdot 200\\cdot 0{,}1^2 = 1\\ \\text{J}\\)."],["Khi vật ở vị trí biên, động năng của con lắc cực đại.",0,"Ở biên \\(v = 0\\) nên động năng bằng 0, thế năng cực đại."],["Khi vật đi qua vị trí cân bằng, thế năng đàn hồi bằng 0.",1,"Tại vị trí cân bằng \\(x = 0\\) nên \\(W_t = \\dfrac{1}{2}kx^2 = 0\\)."],["Cơ năng của con lắc giảm dần theo thời gian.",0,"Bỏ qua ma sát nên cơ năng được bảo toàn."]]},
{t:'tf',s:1,q:"Một máy biến áp lí tưởng có \\(N_1 = 100\\) vòng, \\(N_2 = 200\\) vòng, điện áp hiệu dụng ở cuộn sơ cấp \\(U_1 = 50\\ \\text{V}\\). Xét các nhận định sau:",i:[["Đây là máy tăng áp.",1,"\\(N_2 > N_1\\) nên điện áp thứ cấp lớn hơn sơ cấp."],["Điện áp hiệu dụng ở cuộn thứ cấp là \\(100\\ \\text{V}\\).",1,"\\(U_2 = U_1\\cdot\\dfrac{N_2}{N_1} = 50\\cdot\\dfrac{200}{100} = 100\\ \\text{V}\\)."],["Máy biến áp làm thay đổi tần số của dòng điện xoay chiều.",0,"Máy biến áp không làm thay đổi tần số."],["Công suất ở cuộn thứ cấp lớn hơn công suất ở cuộn sơ cấp.",0,"Máy lí tưởng không hao phí nên hai công suất bằng nhau."]]},
{t:'tf',s:2,q:"Cho hàm số \\(y = x^3 - 3x + 2\\). Xét các nhận định sau:",i:[["Đạo hàm của hàm số là \\(y' = 3x^2 - 3\\).",1,"\\((x^3)' = 3x^2,\\ (-3x)' = -3\\)."],["Hàm số đồng biến trên khoảng \\((-1;\\,1)\\).",0,"Trên \\((-1;\\,1)\\) có \\(y' < 0\\) nên hàm số nghịch biến."],["Hàm số đạt cực tiểu tại \\(x = 1\\).",1,"\\(y'\\) đổi dấu từ âm sang dương tại \\(x = 1\\) (\\(y'' = 6x > 0\\))."],["Giá trị cực đại của hàm số bằng 0.",0,"Giá trị cực đại là \\(y(-1) = 4\\); giá trị cực tiểu mới bằng 0."]]},
{t:'tf',s:2,q:"Xét các nhận định về nguyên hàm và tích phân sau:",i:[["\\(\\int_0^2 3x^2\\,dx = 8\\).",1,"\\(\\left[x^3\\right]_0^2 = 8\\)."],["Một nguyên hàm của hàm số \\(f(x) = \\cos x\\) là \\(F(x) = \\sin x\\).",1,"\\((\\sin x)' = \\cos x\\)."],["\\(\\int \\dfrac{1}{x}\\,dx = \\ln x + C\\) với mọi \\(x \\neq 0\\).",0,"Đúng phải là \\(\\ln|x| + C\\); \\(\\ln x\\) chỉ xác định khi \\(x > 0\\)."],["\\(\\int_0^1 2x\\,dx = 1\\).",1,"\\(\\left[x^2\\right]_0^1 = 1\\)."]]},
{t:'tf',s:2,q:"Xét các nhận định về lôgarit và hàm số mũ sau:",i:[["\\(\\log_2 8 = 3\\)",1,"\\(2^3 = 8\\)"],["\\(\\log_2(a + b) = \\log_2 a + \\log_2 b\\) với mọi \\(a, b > 0\\).",0,"Đẳng thức đúng là \\(\\log_2(ab) = \\log_2 a + \\log_2 b\\)."],["Hàm số \\(y = \\log_2 x\\) đồng biến trên khoảng \\((0;\\,+\\infty)\\).",1,"Cơ số \\(2 > 1\\) nên hàm số đồng biến."],["Phương trình \\(2^x = 8\\) có nghiệm \\(x = 4\\).",0,"\\(2^x = 2^3\\) nên \\(x = 3\\)."]]},
{t:'sa',s:3,q:"Bộ nhiễm sắc thể lưỡng bội (\\(2n\\)) của người có bao nhiêu nhiễm sắc thể? (chỉ nhập số)",a:["46"],e:"Người có \\(2n = 46\\) (23 cặp NST)."},
{t:'sa',s:3,q:"Phép lai \\(\\text{AaBb} \\times \\text{AaBb}\\), các gen phân li độc lập. Tỉ lệ kiểu gen \\(\\text{aabb}\\) ở đời con là bao nhiêu? (nhập dạng phân số, ví dụ 1/4)",a:["1/16"],e:"\\(\\text{aa}\\) chiếm \\(\\dfrac{1}{4}\\), \\(\\text{bb}\\) chiếm \\(\\dfrac{1}{4}\\) nên \\(\\text{aabb} = \\dfrac{1}{4}\\times\\dfrac{1}{4} = \\dfrac{1}{16}\\)."},
{t:'sa',s:3,q:"Theo thuyết tiến hóa hiện đại, đơn vị tiến hóa cơ sở là gì?",a:["quần thể"],e:"Quần thể là đơn vị tiến hóa cơ sở."},
{t:'sa',s:3,q:"Mạch gốc của một gen có trình tự 3'-TAXGGT-5'. Hãy viết trình tự mARN (chiều 5'→3', viết liền, không dấu cách) được phiên mã từ mạch này.",a:["AUGXXA","AUGCCA"],e:"Phiên mã theo nguyên tắc bổ sung A–U, T–A, G–X, X–G nên mARN là 5'-AUGXXA-3'."},
{t:'sa',s:3,q:"Một gen dài \\(5100\\ \\text{Å}\\) thì có tổng số bao nhiêu nuclêôtit? (chỉ nhập số)",a:["3000"],e:"\\(N = \\dfrac{2L}{3{,}4} = \\dfrac{2\\cdot 5100}{3{,}4} = 3000\\) nuclêôtit."},
{t:'sa',s:3,q:"Quá trình dịch mã (tổng hợp prôtêin) diễn ra ở bào quan nào?",a:["ribôxôm","ribosom","ribosome"],e:"Dịch mã diễn ra ở ribôxôm."},
{t:'sa',s:3,q:"Bộ ba mở đầu trên mARN (mã hóa axit amin mở đầu) là gì? (viết 3 chữ cái)",a:["AUG"],e:"Bộ ba mở đầu là 5'-AUG-3'."},
{t:'sa',s:4,q:"Tính tích phân \\(\\int_0^2 3x^2\\,dx\\). (chỉ nhập số)",a:["8"],e:"Nguyên hàm là \\(x^3\\); thay cận: \\(2^3 - 0^3 = 8\\)."},
{t:'sa',s:4,q:"Mũi tên Nỏ Thần có vận tốc \\(v(t) = 2t + 4\\ (\\text{m/s})\\). Quãng đường đi được trong 3 giây đầu là bao nhiêu mét? (chỉ nhập số)",a:["21"],e:"\\(s = \\int_0^3 (2t + 4)\\,dt = t^2 + 4t = 9 + 12 = 21\\ \\text{m}\\)."},
{t:'sa',s:4,q:"Con lắc lò xo có \\(k = 200\\ \\text{N/m}\\), biên độ \\(A = 0{,}1\\ \\text{m}\\). Cơ năng của con lắc là bao nhiêu jun? (chỉ nhập số)",a:["1"],e:"\\(W = \\dfrac{1}{2}kA^2 = \\dfrac{1}{2}\\cdot 200\\cdot 0{,}01 = 1\\ \\text{J}\\)."},

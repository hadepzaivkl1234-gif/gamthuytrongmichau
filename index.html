<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trọng Thủy Giải Cứu Mị Nương</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-family:'Segoe UI',system-ui,sans-serif}
html,body{width:100%;height:100%;background:#090d16;color:#f0f6fc;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#hud{display:flex;gap:5px;padding:4px 8px;background:#0d1117;font-size:12px;font-weight:600;align-items:center;flex-wrap:wrap}
.p{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:3px 9px;color:#e6edf3}
.bar{width:80px;height:9px;background:#21262d;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f85149,#ff9b8f)}
#rel span{opacity:.25;font-size:16px;margin:0 2px}#rel .on{opacity:1}
#stage{position:relative;flex:1;min-height:0;background:#000}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#ov{position:absolute;inset:0;background:rgba(1,4,9,.93);display:flex;overflow:auto;padding:12px;z-index:9}
.cd{max-width:560px;width:100%;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;text-align:center;margin:auto}
.cd h2{color:#f0883e;font-size:18px;margin:6px 0 10px}
.cd p{font-size:13px;line-height:1.55;text-align:justify;background:#0d1117;border-left:3px solid #f0883e;padding:10px;border-radius:8px;margin-bottom:10px}
.b{display:block;width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;background:linear-gradient(135deg,#238636,#2ea043);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.b.r{background:#8b2b2b}.b.s{background:#1f6feb}
.op{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;cursor:pointer}.op.ok{background:#1a5f2c}.op.no{background:#7a2323}
.q{text-align:left;font-weight:600;background:#0d1117;padding:10px;border-radius:8px;margin:8px 0;line-height:1.5;font-size:15px}
.tag{background:#1f6feb;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700}
#fb{font-size:13px;min-height:20px;margin-top:6px;text-align:left}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin:8px 0}.g div{background:#0d1117;padding:6px;border-radius:6px}
#tc{display:none;justify-content:space-between;padding:6px 14px 10px;background:#0d1117}#tc div{display:flex;gap:12px}
@media(pointer:coarse){#tc{display:flex}}
.t{width:60px;height:60px;border-radius:50%;background:rgba(48,54,61,.8);border:2px solid #58a6ff;color:#fff;font-size:22px;touch-action:none}.t.pr{background:#1f6feb}
#ov.low{background:none;pointer-events:none;align-items:flex-end;padding:6px}#ov.low .cd{pointer-events:auto;background:none;border:0;padding:0;max-width:340px}
#rel img{width:26px;height:26px;opacity:.28;filter:grayscale(1);margin:0 2px;vertical-align:middle}#rel img.on{opacity:1;filter:none}
</style></head><body><div id="app">
<div id="hud"><span class="p" id="hl"></span><span class="p">❤ <span class="bar"><i id="hb"></i></span> <b id="ht"></b></span><span class="p" id="ha"></span><span class="p" id="hs"></span><span class="p" id="hm"></span><span id="rel"></span><span style="flex:1"></span><button class="p" onclick="inv()" title="Túi đồ (I)">🎒</button><button class="p" id="mb" onclick="mute()">🔊</button><input type="range" id="vol" min="0" max="1" step=".05" oninput="setv(this.value)"></div>
<div id="stage"><canvas id="c" width="900" height="460"></canvas><div id="ov"></div></div>
<div id="tc"><div><button class="t" data-k="left">◀</button><button class="t" data-k="right">▶</button></div><div><button class="t" data-k="jump">▲</button><button class="t" data-k="shoot">🏹</button></div></div></div>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=900,H=460,G=384,SK='ttmn_save_v2',cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rd=Math.random;
const fresh=()=>({lv:0,done:0,rel:[0,0,0,0,0],score:0,ok:0,bad:0,kills:0,hits:0,time:0,vol:.5,mute:0,chest:-1});
const load=()=>{try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
let S=Object.assign(fresh(),load()||{});
const fmt=s=>((s/60)|0)+':'+String(s%60|0).padStart(2,'0');
// ===== ÂM THANH =====
let AC,mg,mt,mi=-1,ms=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination)}catch(e){return}}if(AC.state=='suspended')AC.resume();mg.gain.value=S.mute?0:S.vol}
function tone(f,t,d,v,f2){if(!AC||S.mute||AC.state!='running')return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(mg);o.start(n);o.stop(n+d)}
const SF={shoot:[620,'triangle',.1,.1,300],jump:[300,'sine',.12,.1,520],hit:[220,'square',.08,.07],kill:[160,'sawtooth',.2,.12,60],hurt:[130,'sawtooth',.25,.15,70],chest:[520,'sine',.3,.12,880],ok:[660,'sine',.4,.15,1320],bad:[160,'sawtooth',.35,.14,80],boss:[90,'sawtooth',.5,.18,50],bdie:[200,'sawtooth',1.2,.2,30],win:[523,'triangle',.8,.15,1046]},ls={};
function sfx(n){const t=performance.now();if(ls[n]&&t-ls[n]<70)return;ls[n]=t;tone(...SF[n])}
const MU=[{s:[0,2,4,7,9],b:196,t:.3,w:'triangle'},{s:[0,3,5,6,10],b:147,t:.4,w:'sine'},{s:[0,2,4,5,7],b:174,t:.26,w:'square'},{s:[0,1,5,7,8],b:130,t:.38,w:'sine'},{s:[0,1,3,6,7],b:110,t:.18,w:'sawtooth'},{s:[0,2,4,7,9],b:262,t:.2,w:'triangle'}];
function music(i){clearInterval(mt);mi=i;if(i<0)return;mt=setInterval(()=>{if(!AC||S.mute||AC.state!='running')return;const m=MU[mi];tone(m.b*Math.pow(2,m.s[(ms*2+(ms>>3))%5]/12)*(ms%8<4?1:1.5),m.w,m.t*1.6,.045);if(ms%4==0)tone(m.b/2,'sine',m.t*3,.06);ms++},MU[i].t*1000)}
function mute(){S.mute^=1;au();save();hud()}
function setv(v){S.vol=+v;if(mg)mg.gain.value=S.mute?0:S.vol;save()}
// ===== NGÂN HÀNG CÂU HỎI (đã kiểm tra đáp án) =====
const SUB=['HÓA HỌC 12','VẬT LÝ 12','TOÁN HỌC 12','SINH HỌC 12','TỔNG HỢP TOÁN – LÝ 12'];
const QB=[
[0,"Đồng thau (dùng làm đồ dùng, binh khí cổ) là hợp kim của đồng (Cu) với kim loại nào sau đây?",["Kẽm (Zn)","Nhôm (Al)","Sắt (Fe)","Bạc (Ag)"],0,"Đồng thau là hợp kim Cu–Zn."],
[0,"Để bảo vệ chi tiết bằng sắt khỏi ăn mòn điện hóa trong môi trường ẩm, người ta gắn vào nó lá kim loại nào?",["Đồng (Cu)","Kẽm (Zn)","Bạc (Ag)","Chì (Pb)"],1,"Zn hoạt động hơn Fe nên bị ăn mòn thay (bảo vệ điện hóa)."],
[0,"Glucozơ (C6H12O6) thuộc loại cacbohiđrat nào?",["Monosaccarit","Đisaccarit","Polisaccarit","Lipit"],0,"Glucozơ là monosaccarit."],
[0,"Phản ứng thủy phân este trong dung dịch NaOH, đun nóng, gọi là phản ứng:",["Este hóa","Xà phòng hóa","Trùng ngưng","Hiđro hóa"],1,"Tạo muối cacboxylat và ancol."],
[1,"Cơ cấu lẫy nỏ như con lắc lò xo có k = 200 N/m, biên độ A = 0,1 m. Cơ năng cực đại là:",["2 J","1 J","10 J","0,5 J"],1,"W = ½kA² = ½·200·0,01 = 1 J."],
[1,"Vật dao động điều hòa x = 4cos(2πt) cm có chu kì là:",["0,5 s","1 s","2 s","π s"],1,"T = 2π/ω = 1 s."],
[1,"Máy biến áp lí tưởng có N1 = 100 vòng, N2 = 200 vòng, U1 = 50 V. Điện áp hai đầu cuộn thứ cấp là:",["25 V","50 V","100 V","200 V"],2,"U2 = U1·N2/N1 = 100 V."],
[2,"Độ cao h(t) = −t² + 6t + 5 (m). Độ cao cực đại đạt được là:",["11 m","14 m","16 m","9 m"],1,"Cực đại tại t = 3: h = 14 m."],
[2,"Giá trị cực tiểu của hàm số y = x³ − 3x + 2 là:",["4","0","−1","1"],1,"y' = 0 tại x = 1 (cực tiểu): y = 0."],
[2,"Giá trị của log₂8 là:",["2","3","4","8"],1,"2³ = 8."],
[3,"Mạch đơn ADN có trình tự 5'-A-T-G-X-3' thì mạch bổ sung là:",["3'-T-A-X-G-5'","3'-U-A-X-G-5'","5'-T-A-X-G-3'","3'-G-X-T-A-5'"],0,"A–T, G–X và hai mạch ngược chiều."],
[3,"Phép lai AaBb × AaBb (phân li độc lập) cho đời con kiểu gen aabb với tỉ lệ:",["1/4","1/8","1/16","9/16"],2,"1/4 aa × 1/4 bb = 1/16."],
[3,"Bộ nhiễm sắc thể lưỡng bội (2n) của người có bao nhiêu NST?",["23","44","46","48"],2,"Người có 2n = 46."],
[3,"Đơn vị tiến hóa cơ sở theo thuyết tiến hóa hiện đại là:",["Cá thể","Quần thể","Loài","Quần xã"],1,"Quần thể là đơn vị tiến hóa cơ sở."],
[4,"Tích phân I = ∫ từ 0 đến 2 của 3x² dx bằng:",["6","8","12","4"],1,"[x³] từ 0 đến 2 = 8."],
[4,"Mũi tên Nỏ Thần có v(t) = 2t + 4 (m/s). Quãng đường trong 3 giây đầu là:",["15 m","21 m","18 m","10 m"],1,"s = t² + 4t = 9 + 12 = 21 m."]];
const LP=[[0],[1],[2],[3],[1,2,4]];
// ===== 5 MÀN CHƠI (bản đồ rộng) =====
const LV=[
{n:'Rừng Trúc Cổ Loa',s:['#0b2e22','#2a7a4f'],gr:'#1a3b2e',tp:'#3d9a5f',W:3000,ne:6,hp:50,at:10,sp:1.4,pit:[1000,1900],pl:[620,1350,2100,2550],rn:'Giáp Đồng Đông Sơn',msg:'Phong ấn Hóa học 12 đã mở! [Giáp Đồng Đông Sơn]: +100 HP tối đa và giảm sát thương nhận vào.'},
{n:'Đầm Lầy Sương Mù',s:['#141c2a','#3a4d68'],gr:'#2c3a4f',tp:'#4d6a8a',W:3200,ne:7,hp:90,at:16,sp:1.9,pit:[900,1700,2500],pl:[500,1200,1950,2700],rn:'Nỏ Thần Liên Châu',msg:'Phong ấn Vật lý 12 đã giải! [Nỏ Thần Liên Châu]: bắn 3 mũi tên cùng lúc, tốc độ bắn nhanh hơn.'},
{n:'Núi Đá Sóc Sơn',s:['#2b1d16','#8a5a3a'],gr:'#473024',tp:'#a0714d',W:3400,ne:8,hp:150,at:22,sp:2.3,pit:[800,1500,2200,2900],pl:[450,1150,1850,2550,3100],rn:'Ngựa Sắt Phù Đổng',msg:'Phong ấn Toán học 12 hoàn tất! [Ngựa Sắt Phù Đổng]: chạy nhanh, nhảy cao và phun lửa thiêu kẻ địch ở gần.'},
{n:'Hầm Mộ Lạc Việt',s:['#150d22','#4a2d7a'],gr:'#33214d',tp:'#6b4aa0',W:3600,ne:9,hp:220,at:28,sp:2.7,pit:[900,1600,2300,3000],pl:[500,1250,1950,2650,3250],rn:'Ngọc Trai Tinh Khiết',msg:'Phong ấn Sinh học 12 khai mở! [Ngọc Trai Tinh Khiết]: +80 HP, +30 sát thương, hồi máu khi hạ yêu ma.'},
{n:'Đỉnh Tháp Hắc Ám',s:['#0a0510','#3a1450'],gr:'#26132b',tp:'#5a2a6a',W:2800,ne:2,hp:150,at:30,sp:2.2,pit:[800,1300],pl:[500,1000,1500],boss:1,rn:'Chìa Khóa Vạn Năng',msg:'Mật mã cuối cùng đã giải! [Chìa Khóa Vạn Năng] mở lồng giam Mị Nương!'}];
// ===== TRẠNG THÁI =====
let st='MENU',lvl=0,L=LV[0],P,en=[],ar=[],bp=[],fr=[],pt=[],pl=[],chest=null,B=null,cam=0,fc=0,lt=0,lh=0,fade=0,banner=null,msg=null,shake=0,used=new Set(),cq,wt=0,wa=0,wd=0,cage=0,dirty=0,snap={};
const inp={left:0,right:0,jump:0,shoot:0},pit=x=>L.pit.some(a=>x>a&&x<a+110),ov2=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const ov=h=>{const o=$('ov');o.className='';o.innerHTML='<div class="cd">'+h+'</div>';o.style.display='flex';o.scrollTop=0};
function hud(){const p=P||{hp:100,maxHp:100,atk:25};$('hl').textContent=P?'Màn '+(lvl+1)+'/5: '+L.n:'Trọng Thủy Giải Cứu Mị Nương';$('hb').style.width=cl(p.hp/p.maxHp*100,0,100)+'%';$('ht').textContent=Math.max(0,p.hp|0)+'/'+p.maxHp;$('ha').textContent='🏹 '+p.atk;$('hs').textContent='⭐ '+S.score;$('hm').textContent='⏱ '+fmt(S.time);
rel2();$('mb').textContent=S.mute?'🔇':'🔊';$('vol').value=S.vol}
function menu(){st='MENU';music(-1);hud();ov('<h2>Trọng Thủy Giải Cứu Mị Nương</h2><p>Thành Cổ Loa thất thủ, Mị Nương bị Ma Vương giam trên Đỉnh Tháp Hắc Ám. Mang theo nỗi ân hận và quyết tâm chuộc lỗi, Trọng Thủy vượt 5 vùng đất, giải mã các phong ấn tri thức Hóa – Lý – Toán – Sinh lớp 12 để thức tỉnh bảo vật, đánh bại Ma Vương và giải cứu Mị Nương!</p>'+((S.score>0||S.lv>0)&&S.done<5?'<button class="b" onclick="cont()">▶ Tiếp tục (Màn '+(S.lv+1)+')</button>':'')+'<button class="b s" onclick="newg()">🆕 Chơi mới</button><button class="b r" onclick="clr()">🗑 Xóa dữ liệu trò chơi</button><p style="font-size:12px">A/D hoặc ←→: di chuyển · W/Space/↑: nhảy · J/Enter: bắn cung</p>')}
function cont(){au();S=Object.assign(fresh(),load()||S);used=new Set();if(S.chest>=0)showChest(S.chest);else startLv(S.lv)}
function restart(){S=Object.assign(fresh(),{vol:S.vol,mute:S.mute});used=new Set();save();au();startLv(0)}
function ask(t,yes){ov('<h2>'+t+'</h2><button class="b" id="ay">✔ Đồng ý</button><button class="b s" onclick="menu()">✖ Hủy</button>');$('ay').onclick=yes}
function newg(){const o=load();if(o&&(o.lv>0||o.score>0)){ask('Chơi mới sẽ ghi đè tiến trình đã lưu. Tiếp tục?',restart);return}restart()}
function clr(){ask('Bạn có chắc muốn xóa toàn bộ dữ liệu trò chơi không?',()=>{try{localStorage.removeItem(SK)}catch(e){}S=Object.assign(fresh(),{vol:S.vol,mute:S.mute});menu()})}
function applyRel(){const r=S.rel,p=P;p.maxHp=100;p.def=0;p.atk=25;p.sp=4.3;p.jf=-11.5;if(r[0]){p.maxHp=200;p.def=6}if(r[1])p.atk=55;if(r[2]){p.sp=6.8;p.jf=-14}if(r[3]){p.atk+=30;p.maxHp+=80}}
function mk(x,hp,at,sp,boss){return{x,y:G-(boss?130:52),w:boss?90:36,h:boss?130:52,hp,mhp:hp,at,sp,boss,t:0,fl:0,f:-1,arm:0}}
function startLv(i){lvl=i;L=LV[i];P={x:60,y:300,w:34,h:52,vx:0,vy:0,f:1,gr:0,hp:1,maxHp:100,def:0,atk:25,sp:4.3,jf:-11.5,cd:0,inv:0,sh:0,t:0,st:'idle',safe:60};applyRel();P.hp=P.maxHp;
en=[];ar=[];bp=[];fr=[];pt=[];chest=null;B=null;cam=0;lt=0;lh=0;cage=0;msg=null;pl=L.pl.map((x,k)=>({x,y:300-(k%2)*55,w:150}));
snap={score:S.score,ok:S.ok,bad:S.bad,kills:S.kills,hits:S.hits};
for(let k=0;k<L.ne;k++){let x=520+k*(L.W-1300)/L.ne;while(pit(x+18)||pit(x+80))x+=40;en.push(mk(x,L.hp,L.at,L.sp,0))}
if(L.boss){B=mk(L.W-700,950,38,0,1);Object.assign(B,{ph:1,cd:120,sk:null,tl:0,tm:1,dead:0,dt:0,gone:0})}
S.lv=i;save();fade=1;banner=['Màn '+(i+1)+': '+L.n,150];music(i);st='PLAY';$('ov').style.display='none';hud()}
function retry(){Object.assign(S,snap);startLv(lvl)}
// ===== CHIẾN ĐẤU =====
function burst(x,y,c,n){for(let k=0;k<n&&pt.length<260;k++)pt.push({x,y,vx:(rd()-.5)*7,vy:(rd()-.5)*7-1,l:30+rd()*20,c,gv:.12})}
function shoot(){const p=P;if(p.cd>0||st!='PLAY')return;const c=S.rel[1];p.cd=c?16:24;p.sh=12;sfx('shoot');const x=p.f>0?p.x+p.w:p.x-16,y=p.y+22,v=c?11:8.5;(c?[-1.6,0,1.6]:[0]).forEach(vy=>ar.push({x,y,vx:p.f*v,vy,d:p.atk,dv:c}))}
function hurt(d){if(P.inv>0||st!='PLAY')return;P.hp-=d;P.inv=60;S.hits++;lh++;sfx('hurt');burst(P.x+17,P.y+26,'#f85149',8);hud();if(P.hp<=0)die()}
function die(){st='OVER';music(-1);ov('<h2>💀 Trọng Thủy đã kiệt sức!</h2><p>Binh đoàn bóng tối quá đông đảo... Hãy giữ vững ý chí giải cứu Mị Nương và thử lại màn này!</p><button class="b" onclick="retry()">Thử lại màn này</button><button class="b s" onclick="menu()">Về màn hình chính</button>')}
function dmg(e,d,q){e.hp-=d;e.fl=6;if(!q)sfx('hit');if(e.hp<=0&&!e.dead)kill(e)}
function kill(e){e.dead=1;dirty=1;S.kills++;if(e.boss){S.score+=500;sfx('bdie');shake=40;en.forEach(m=>{m.dead=1;burst(m.x+18,m.y+26,'#c678ff',10)});bp=[];msg=['Ma Vương bị đánh bại! Hãy đến rương phong ấn!',200]}else{S.score+=20;sfx('kill');burst(e.x+e.w/2,e.y+e.h/2,'#ff6b6b',14);if(S.rel[3])P.hp=Math.min(P.maxHp,P.hp+25)}hud()}
function bossStep(){const b=B;b.t++;if(b.fl>0)b.fl--;
if(b.dead){b.dt++;if(b.dt%5==0)burst(b.x+rd()*b.w,b.y+rd()*b.h,'#ffb347',10);if(b.dt>=100)b.gone=1;return}
const r=b.hp/b.mhp,np=r>.7?1:r>.35?2:3,dx=P.x-b.x;
if(np>b.ph){b.ph=np;b.sk=null;b.cd=80;shake=20;burst(b.x+45,b.y+60,'#c678ff',30);msg=['⚠ Ma Vương bước vào giai đoạn '+np+'!',120]}
b.f=dx>0?1:-1;b.arm=b.sk?1:0;
